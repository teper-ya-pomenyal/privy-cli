name: deb

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: собрать .deb
        run: ./build-deb.sh
      - name: приложить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: privy-client_*_all.deb
      - name: приложить к release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: privy-client_*_all.deb
